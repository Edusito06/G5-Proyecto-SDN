# Inventario para correr Ansible desde el controller por la red de gestión
# OOB (ens3, 192.168.0.0/24), como en el repo del Lab 5.
[onos]
controller ansible_connection=local

[switches]
sw1 ansible_host=192.168.0.11
sw2 ansible_host=192.168.0.12
sw3 ansible_host=192.168.0.13

[identidad]
h3

[endpoints]
h1 ansible_host=192.168.0.21
h2 ansible_host=192.168.0.22
h3 ansible_host=192.168.0.23
h4 ansible_host=192.168.0.24

[all:vars]
ansible_user=ubuntu
