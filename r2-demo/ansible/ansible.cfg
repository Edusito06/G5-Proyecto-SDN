[defaults]
inventory = inventory_mac.ini
host_key_checking = False
interpreter_python = /usr/bin/python3
callback_result_format = yaml
retry_files_enabled = False
timeout = 30

[privilege_escalation]
# En el slice el usuario ubuntu tiene sudo sin contraseña (sudoers.d creado
# por el usuario), así que no se pregunta ninguna contraseña.
become_ask_pass = False

[ssh_connection]
pipelining = True
