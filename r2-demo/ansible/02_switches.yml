# Paso 2: bootstrap de los OVS (día 0). Deja cada bridge con DPID fijo,
# OpenFlow 1.3, fail-mode secure, números de puerto fijos y sin reglas,
# conectado a ONOS. Ansible no instala las reglas de R2: eso lo hace r2ctl.
# Uso: ansible-playbook 02_switches.yml
- name: Bootstrap de los switches
  hosts: switches
  become: true
  gather_facts: false
  vars_files: [../r2/topology.yaml]
  vars:
    controller: "tcp:192.168.0.10:6653"
    sw: "{{ switches[inventory_hostname] }}"
  tasks:
    - name: DPID fijo, OpenFlow 1.3 y fail-mode secure
      ansible.builtin.command: >-
        ovs-vsctl set bridge {{ inventory_hostname }}
        other-config:datapath-id={{ '%016x' | format(sw.dpid.split(':')[1] | int(base=16)) }}
        protocols=OpenFlow13 fail_mode=secure
      changed_when: true

    - name: Fijar el número de cada puerto (ofport_request)
      ansible.builtin.command: >-
        ovs-vsctl set Interface {{ item.value.iface }} ofport_request={{ item.key }}
      loop: "{{ sw.puertos | dict2items }}"
      changed_when: true

    - name: Borrar las reglas previas
      ansible.builtin.command: ovs-ofctl -O OpenFlow13 del-flows {{ inventory_hostname }}
      changed_when: true

    - name: Conectar a ONOS
      ansible.builtin.command: ovs-vsctl set-controller {{ inventory_hostname }} {{ controller }}
      changed_when: true

    - name: Esperar la conexión OpenFlow
      ansible.builtin.command: ovs-vsctl --bare --columns=is_connected list controller
      register: conn
      until: "'true' in conn.stdout"
      retries: 20
      delay: 3
      changed_when: false

    - name: Resumen
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ sw.dpid }}) conectado a {{ controller }}"
