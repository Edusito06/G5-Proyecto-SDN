# Inventario para correr Ansible desde el Mac, reutilizando los canales SSH
# ControlMaster que abre el usuario (ctl-<puerto>). No se escribe ninguna contraseña.
[onos]
controller ansible_port=5800

[switches]
sw1 ansible_port=5801
sw2 ansible_port=5802
sw3 ansible_port=5803

[identidad]
h3

[endpoints]
h1 ansible_port=5811
h2 ansible_port=5812
h3 ansible_port=5813
h4 ansible_port=5814

[all:vars]
ansible_user=ubuntu
ansible_host=10.20.12.76
ansible_ssh_common_args=-o ControlMaster=no -o ControlPath=/Users/eduardorodasarias/.ssh/ctl-{{ ansible_port }} -o BatchMode=yes
