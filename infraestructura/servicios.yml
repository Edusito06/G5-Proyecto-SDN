---
# Servicios del campus G05 sobre la fábrica OpenFlow:
#  - segmentos VLAN: rol x 100 (R-SW1 <-> Core-1), 111 (DNS/DHCP), 112 (LDAP/RADIUS), 113 (Recursos)
#  - Core-1 como router (nftables aísla gestión, control y el propio Core-1)
#  - relay DHCP en Core-1, Kea en DNS/DHCP y servicios de prueba en los servidores
# La política por rol (R2) la instala r2ctl por ONOS en R-SW1 (ver politica/).
#   ansible-playbook -i inventario.yml -i inventario-servidores.yml servicios.yml -k -K
#
# Las VMs del slice no tienen salida a Internet. Si faltan kea-dhcp4-server (DNS/DHCP)
# o isc-dhcp-relay (Core-1), descárgalos en ONOS-1 con `apt-get download` y cópialos
# a la VM antes de ejecutar este playbook.

- name: Segmentos de servicio en los switches que los transportan
  hosts: core-1:dc-dist:r-sw1   # en R-SW1 solo retira reglas antiguas: el puerto de usuarios es de r2ctl
  become: true
  gather_facts: false
  tasks:
    - name: Copiar el módulo
      ansible.builtin.copy:
        src: files/g05-servicios.py
        dest: /usr/local/sbin/g05-servicios
        mode: "0755"
    - name: Servicio y comprobación periódica (solo reinstala si hay diferencias)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: g05-servicios.service
          content: |
            [Unit]
            Description=Segmentos de servicio del G05 (VLAN 200 alumnos, VLAN 111 G11)
            After=openvswitch-switch.service systemd-networkd.service
            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/g05-servicios apply
        - name: g05-servicios.timer
          content: |
            [Unit]
            Description=Restaurar los segmentos de servicio
            [Timer]
            OnBootSec=15s
            OnUnitInactiveSec=30s
            [Install]
            WantedBy=timers.target
    - name: Aplicar segmentos
      ansible.builtin.command: /usr/local/sbin/g05-servicios apply
      changed_when: false
    - name: Habilitar la comprobación periódica
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: g05-servicios.timer
        enabled: true
        state: started

- name: Relay DHCP de alumnos en Core-1
  hosts: core-1
  become: true
  gather_facts: false
  tasks:
    - name: Unidad del relay (VLAN 200 -> Kea por el segmento G11)
      ansible.builtin.copy:
        dest: /etc/systemd/system/g05-dhcrelay.service
        mode: "0644"
        content: |
          [Unit]
          Description=Relay DHCP de alumnos (VLAN 200 -> Kea 10.100.1.130) del G05
          After=network-online.target openvswitch-switch.service systemd-networkd.service
          Wants=network-online.target
          [Service]
          ExecStart=/usr/sbin/dhcrelay -4 -d -id v200 -iu g11 10.100.1.130
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
    - name: Desactivar las unidades de ejemplo del paquete
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: [isc-dhcp-relay.service, isc-dhcp-relay6.service]
      failed_when: false
    - name: Arrancar el relay
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: g05-dhcrelay.service
        enabled: true
        state: started

- name: Core-1 como router (reenvío IPv4 con nftables)
  hosts: core-1
  become: true
  gather_facts: false
  tasks:
    - name: Reglas nftables
      ansible.builtin.copy:
        src: files/g05-core1-router.nft
        dest: /etc/g05-core1-router.nft
        mode: "0644"
        validate: nft -c -f %s
    - name: Unidad que carga el firewall y luego activa el reenvío
      ansible.builtin.copy:
        dest: /etc/systemd/system/g05-router.service
        mode: "0644"
        content: |
          [Unit]
          Description=Core-1 como router de servicios del G05 (nftables + reenvio IPv4)
          After=network-pre.target
          Before=network.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/nft -f /etc/g05-core1-router.nft
          ExecStart=/usr/sbin/sysctl -w net.ipv4.ip_forward=1
          [Install]
          WantedBy=multi-user.target
    - name: Activar
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: g05-router.service
        enabled: true
        state: restarted

- name: Servidores (IPs por recurso, ruta de vuelta y servicios de prueba)
  hosts: servidores
  become: false
  gather_facts: false
  tasks:
    - name: Copiar svc.py y el script de preparación
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/tmp/{{ item }}"
        mode: "0755"
      loop: [svc.py, servidores.sh]
    - name: Instalar svc.py
      ansible.builtin.command: sudo install -D -m 755 /tmp/svc.py /opt/g05/svc.py
    - name: Preparar el servidor
      ansible.builtin.command: "bash /tmp/servidores.sh {{ inventory_hostname }}"

- import_playbook: dhcp.yml
